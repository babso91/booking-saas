name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Applies every migration from scratch on a real Supabase stack
      # (PostgreSQL, Auth, PostgREST, Mailpit for confirmation emails).
      - name: Start local Supabase
        run: >-
          npx supabase start
          -x studio,imgproxy,vector,logflare,realtime,storage-api,edge-runtime,supavisor,postgres-meta
      - name: Generated types match the migrated schema
        run: |
          npm run db:types
          git diff --exit-code src/types/database.generated.ts
      # Upgrade of a populated database (not only a fresh install): reset to
      # an older schema, insert historical rows, migrate to the latest.
      - run: npm run test:upgrade
      - run: npm run test:db
      # Sign-up → confirmation email → /auth/callback against `next start`.
      # The same public origin as `next start` in the end-to-end setup: unset
      # at build time, the browser and the server disagree on her booking
      # host (hydration error in the Classique frame).
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      # The Studio agenda scenarios drive a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
